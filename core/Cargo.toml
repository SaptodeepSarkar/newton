[package]
name = "newton-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Newton's tool-call boundary: the model may only name a preset tool and pass a bounded argument."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
