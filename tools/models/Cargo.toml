[package]
name = "newton-models"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Newton's model manifest: verify checksums and stage downloaded model files."

[[bin]]
name = "newton-fetch"
path = "src/fetch.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
